name: Build dan validasi

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Compile ESP32 Dev Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install FirebaseClient
        run: arduino-cli lib install "FirebaseClient@2.2.13"

      - name: Install ESP_SSLClient
        run: arduino-cli lib install "ESP_SSLClient@3.1.3"

      - name: Install ArduinoJson
        run: arduino-cli lib install "ArduinoJson@7.4.2"

      - name: Install DHT sensor library
        run: arduino-cli lib install "DHT sensor library@1.4.6"

      - name: Install Adafruit Unified Sensor
        run: arduino-cli lib install "Adafruit Unified Sensor@1.1.14"

      - name: Install LiquidCrystal_I2C
        run: arduino-cli lib install "LiquidCrystal_I2C@1.1.2"

      - name: Compile firmware
        run: |
          mkdir -p /tmp/smart_irrigation
          cp firmware/smart_irrigation.ino /tmp/smart_irrigation/
          cp firmware/secrets.example.h /tmp/smart_irrigation/secrets.h
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings all \
            --build-path /tmp/smart-irrigation-build \
            /tmp/smart_irrigation

  static-web:
    name: Validasi website dan JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Periksa sintaks dan struktur
        run: |
          node --check web/app.js
          node --check web/config.js
          python3 -m json.tool web/firebase.json > /dev/null
          python3 -m json.tool firebase/database.rules.json > /dev/null
          python3 -m json.tool firebase/database.rules.private.json > /dev/null
          test -f web/index.html
          test -f web/style.css
          test ! -f firmware/secrets.h
